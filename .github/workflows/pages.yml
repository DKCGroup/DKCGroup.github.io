name: Build and deploy Jekyll site

on:
  push:
    branches:
      - site
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build site
        env:
          JEKYLL_ENV: production
        run: |
          echo "url: ${{ steps.pages.outputs.base_url }}" > _config.pages.yml
          echo "baseurl: \"\"" >> _config.pages.yml
          bundle exec jekyll clean
          bundle exec jekyll build --config _config.yml,_config.pages.yml --destination _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
